# Configuration file for TOW Arbiter
# Customize these settings as needed

[embeddings]
# Model options:
# - "all-MiniLM-L6-v2" (fast, low memory - RECOMMENDED)
# - "all-mpnet-base-v2" (slower, higher quality)
# - "paraphrase-MiniLM-L6-v2" (good for paraphrasing)
model = "all-MiniLM-L6-v2"

[vector_store]
# Directory where the vector store will be persisted
persist_directory = "./data/vector_store"

# Collection name in the vector store
collection_name = "warhammer_rules"

# Vector store type: "chroma" (recommended) or "faiss" (experimental)
backend = "chroma"

[retrieval]
# Number of top documents to retrieve for each query
top_k = 3

# Minimum similarity score for results (0.0-1.0)
# Lower values = more results, higher values = only best matches
min_similarity = 0.3

[documents]
# Directory containing rule files (.md and .txt)
rules_directory = "./rules"

# Maximum chunk size for document processing (characters)
chunk_size = 500

# Overlap between chunks (characters) for context preservation
chunk_overlap = 100

# File extensions to load
extensions = ["md", "txt"]

[generation]
# Use LLM for generation (requires LLM setup)
use_llm = false

# LLM configuration (if use_llm is true)
llm_model = "gpt-3.5-turbo"  # or "llama2" for local via ollama

# Temperature for LLM (0.0-1.0, lower = more deterministic)
temperature = 0.3

# Maximum tokens for LLM response
max_tokens = 512

[logging]
# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"

# Log file path (empty = console only)
log_file = ""

[performance]
# Batch size for embedding documents (higher = faster but more memory)
embedding_batch_size = 32

# Number of worker threads for parallel processing
num_workers = 4

# Enable caching of embeddings (experimental)
use_cache = true
